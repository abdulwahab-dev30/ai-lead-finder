name: Extract AI Lead Finder source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract project files into repository root
        run: |
          test -f AI_Lead_Finder.zip
          unzip -oq AI_Lead_Finder.zip
          cp -a ai-lead-finder/. .
          rm -rf ai-lead-finder
          rm -f AI_Lead_Finder.zip

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add AI Lead Finder application source"
            git push
          fi
