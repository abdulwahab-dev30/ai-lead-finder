name: Restore project source
on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/part-01.txt"
      - ".bootstrap/part-02.txt"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore archived source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-01.txt .bootstrap/part-02.txt | base64 --decode > /tmp/source.gz
          gzip --decompress --stdout /tmp/source.gz > /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          if [ -d /tmp/source/ai-lead-finder ]; then
            cp -a /tmp/source/ai-lead-finder/. .
          else
            cp -a /tmp/source/. .
          fi
          rm -rf .bootstrap
          rm -f .github/workflows/restore-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore AI Lead Finder project source"
          git push
